<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="Pics/IMG_8922.PNG">
  <title>Physical Competition Countdown | CHAYAMANA</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        repeating-linear-gradient(60deg, transparent 0 79px, rgba(255,255,255,.035) 80px),
        repeating-linear-gradient(-60deg, transparent 0 79px, rgba(255,255,255,.035) 80px);
      content: "";
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(760px, 100%);
    }

    .eyebrow {
      margin: 0 0 22px;
      color: #ff9800;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 76px);
      line-height: 1.05;
    }

    h1 span {
      color: #bbb;
      font-weight: 300;
    }

    .date {
      margin: 22px 0 38px;
      color: #aaa;
      font-size: clamp(16px, 3vw, 20px);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 0 auto 36px;
    }

    .unit {
      padding: 22px 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
    }

    .number {
      color: #ff9800;
      font-size: clamp(32px, 7vw, 54px);
      font-weight: 700;
      line-height: 1;
    }

    .label {
      margin-top: 10px;
      color: #999;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .finished {
      display: none;
      margin: 0 0 36px;
      color: #ff9800;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 700;
    }

    .back {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border-radius: 999px;
      background: #ff9800;
      color: #000;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back:hover,
    .back:focus-visible {
      background: #ffb13b;
    }

    @media (max-width: 480px) {
      .countdown {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .unit {
        padding: 18px 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">CHAYAMANA | MCPAS</p>
    <h1>Physical <span>Competition</span></h1>
    <p class="date">December 5, 2026</p>

    <div class="countdown" id="countdown" aria-label="Time remaining until the physical competition">
      <div class="unit"><div class="number" id="days">00</div><div class="label">Days</div></div>
      <div class="unit"><div class="number" id="hours">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="number" id="minutes">00</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="number" id="seconds">00</div><div class="label">Seconds</div></div>
    </div>

    <p class="finished" id="finished" role="status">The physical competition day is here!</p>
    <a class="back" href="index.html">Back to homepage</a>
  </main>

  <script>
    var competitionDate = new Date(2026, 11, 5, 0, 0, 0).getTime();
    var countdown = document.getElementById('countdown');
    var finished = document.getElementById('finished');

    function updateCountdown() {
      var remaining = competitionDate - Date.now();

      if (remaining <= 0) {
        countdown.hidden = true;
        countdown.style.display = 'none';
        finished.style.display = 'block';
        clearInterval(timer);
        return;
      }

      document.getElementById('days').textContent = String(Math.floor(remaining / 86400000)).padStart(2, '0');
      document.getElementById('hours').textContent = String(Math.floor((remaining % 86400000) / 3600000)).padStart(2, '0');
      document.getElementById('minutes').textContent = String(Math.floor((remaining % 3600000) / 60000)).padStart(2, '0');
      document.getElementById('seconds').textContent = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
    }

    var timer;
    updateCountdown();
    if (competitionDate > Date.now()) {
      timer = setInterval(updateCountdown, 1000);
    }
  </script>
</body>
</html>
